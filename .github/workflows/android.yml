name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore keystore cache
        uses: actions/cache@v4
        with:
          path: android/keystore
          key: veliora-keystore-${{ github.repository }}

      - name: Sync web assets into APK
        run: |
          A=android/app/src/main/assets
          rm -rf "$A"
          mkdir -p "$A"
          cp index.html player.html "$A/"
          cp -R css js libs image "$A/"

      - name: Inject internal password
        run: |
          A=android/app/src/main/assets
          HASH="$(printf '%s' 'veliora-apk-internal' | sha256sum | cut -d' ' -f1)"
          SEED="try{localStorage.setItem('passwordVerified',JSON.stringify({verified:true,timestamp:Date.now(),passwordHash:'$HASH'}));}catch(e){}"
          for page in index.html player.html; do
            f="$A/$page"
            grep -q '{{PASSWORD}}' "$f" || { echo "::error::缺少 {{PASSWORD}} 占位: $page"; exit 1; }
            sed -i "s|\"{{PASSWORD}}\";|\"$HASH\"; $SEED|" "$f"
          done
          echo "内部口令哈希: ${HASH:0:12}..."

      - name: Generate keystore if missing
        run: |
          mkdir -p android/keystore
          if [ ! -f android/keystore/veliora.jks ]; then
            keytool -genkeypair -v \
              -keystore android/keystore/veliora.jks \
              -storepass veliora -keypass veliora \
              -alias veliora -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Veliora, OU=Local, O=Veliora, C=CN"
          fi

      - name: Build release APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veliora-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
